    .shine { animation: shine 3.8s ease-in-out 1s infinite; }
    .burst { transform-box: fill-box; transform-origin: center; animation: pop .8s cubic-bezier(.34,1.56,.64,1) .5s both, spin 14s linear 1.3s infinite; }
    .lines { transform-origin: 1180px 75px; animation: spin 40s linear infinite; }
    @keyframes cap { from { transform: scale(0) rotate(-10deg); } to { transform: scale(1) rotate(0); } }
    @keyframes slide { from { transform: translateX(-60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes shine { 0% { transform: translateX(-500px); } 60%,100% { transform: translateX(1500px); } }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
