<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 22" width="1280" height="22" role="img" aria-label="divider">
  <defs>
    <pattern id="stripe" width="84" height="22" patternUnits="userSpaceOnUse">
      <rect width="28" height="22" fill="#FFD700"/><rect x="28" width="28" height="22" fill="#00C2FF"/><rect x="56" width="28" height="22" fill="#FF1F6D"/>
    </pattern>
    <clipPath id="c"><rect width="1280" height="22" rx="11"/></clipPath>
