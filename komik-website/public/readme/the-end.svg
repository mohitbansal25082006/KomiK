  <style>
    .spin { transform-origin: 640px 190px; animation: spin 40s linear infinite; }
    .burst { transform-box: fill-box; transform-origin: center; animation: pop .9s cubic-bezier(.34,1.56,.64,1) both, pulse 2.4s ease-in-out 1s infinite; }
    .word { transform-box: fill-box; transform-origin: center; animation: pop .9s cubic-bezier(.34,1.56,.64,1) .25s both; }
    .sub { animation: fade 1s ease .9s both; }
    .float { animation: float 3s ease-in-out infinite; }
    .wave { transform-origin: 1060px 250px; animation: wave 1.6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { from { transform: scale(0) rotate(-20deg); } to { transform: scale(1) rotate(-4deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.04) rotate(-2deg); } }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes wave { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
